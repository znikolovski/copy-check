<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Copy Check · mock Experience Workspace host</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <style>
      body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr 1fr auto; height: 100vh; }
      header.bar { grid-column: 1 / 3; padding: 8px 16px; background: #1d1d1d; color: #fff; display: flex; gap: 16px; align-items: center; }
      header.bar code { background: #333; padding: 1px 6px; border-radius: 4px; }
      #editor { overflow: auto; padding: 16px 32px; outline: none; grid-column: 1; grid-row: 2; }
      #canvas { grid-column: 1; grid-row: 3; width: 100%; height: 100%; border: 0; border-top: 4px solid #1d1d1d; }
      #plugin { grid-column: 2; grid-row: 2 / 4; }
      #editor > div { border-bottom: 2px dashed #ccc; padding: 4px 0 12px; margin-bottom: 12px; }
      #editor div[class] { border: 1px solid #c9c9c9; border-radius: 6px; margin: 8px 0; position: relative; }
      #editor div[class]::before { content: attr(class); display: block; background: #f2f2f2; padding: 2px 8px; font-weight: 700; font-size: 12px; border-bottom: 1px solid #c9c9c9; }
      #editor div[class].cc-selected { outline: 2px solid #3b63fb; }
      #editor div[class] > div { display: flex; border-top: 1px solid #eee; }
      #editor div[class] > div > div { flex: 1; padding: 4px 8px; border-left: 1px solid #eee; }
      #editor img { max-width: 120px; height: 60px; background: #eee; display: block; }
      #editor pre { background: #f6f6f6; padding: 6px; }
      iframe { width: 400px; height: 100%; border: 0; border-left: 1px solid #ddd; }
      #log { grid-column: 1 / 3; max-height: 140px; overflow: auto; margin: 0; padding: 6px 16px; background: #111; color: #9fe39f; font: 12px/1.4 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <header class="bar">
      <strong>Mock EW host</strong>
      <span>block <code id="sel">none</code></span>
      <span>caps <code id="caps"></code></span>
      <span>token <code id="tok"></code></span>
      <button id="reset" type="button">Reset page</button>
    </header>
    <main id="editor" contenteditable="true" spellcheck="false"></main>
    <iframe id="canvas" title="Canvas (WYSIWYG preview)"></iframe>
    <iframe id="plugin" title="Copy Check"></iframe>
    <pre id="log"></pre>
    <script type="module" src="./host.js"></script>
  </body>
</html>
